<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>통합 피드</title>
  <style>
  :root{
    --bg:#f7f7f4; --surface:#ffffff; --surface2:#f1f1ec; --ink:#1c1f24; --muted:#6d7278;
    --line:#e7e5de; --accent:#4a90c2; --accent-dark:#2f6f9f; --accent-soft:#e8f1f8;
    --ok:#3d9e63; --coral:#e0685a; --coral-soft:#fbf0ee; --teal:#3d968b;
    --radius:18px; --shadow:0 1px 2px rgba(28,31,36,.04),0 10px 28px rgba(28,31,36,.06);
    --free-tile:#e2eefb; --free-tile-2:#eef5fd; --free-ink:#33689e; --free-dot:rgba(51,104,158,.13);
    --gal-tile:#fdeee7; --gal-tile-2:#fdf5ef; --gal-ink:#b85a41; --gal-dot:rgba(184,90,65,.13);
    --dot:rgba(28,31,36,.055);
    --feed-ink:#23272e;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#121417; --surface:#1b1e23; --surface2:#262a30; --ink:#f2f2ee; --muted:#9ba1a8;
      --line:#2b2f36; --accent-soft:#1d2c3a; --coral-soft:#33211e; --shadow:0 12px 32px rgba(0,0,0,.45);
      --free-tile:#22384c; --free-tile-2:#1d303f; --free-ink:#a9cdec; --free-dot:rgba(169,205,236,.14);
      --gal-tile:#43302a; --gal-tile-2:#382a26; --gal-ink:#f0bda9; --gal-dot:rgba(240,189,169,.14);
      --dot:rgba(255,255,255,.06); --feed-ink:#23272e; }
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);background-size:22px 22px;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic","Apple SD Gothic Neo",sans-serif;-webkit-font-smoothing:antialiased}
  button{font:inherit;cursor:pointer}
  a{color:var(--accent-dark)}
  button,[role="button"],select,input:not([type="checkbox"]){min-height:44px}
  .shell{max-width:560px;margin:0 auto;min-height:100dvh;display:flex;flex-direction:column;padding-bottom:78px}
  .topbar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 86%,transparent);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);padding:14px 16px 10px;display:flex;align-items:center;gap:10px}
  .backbtn{display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:999px;background:var(--surface);box-shadow:0 2px 8px rgba(15,23,42,.06);font-size:22px;color:var(--ink);align-items:center;justify-content:center;flex:0 0 auto;line-height:1;padding-bottom:2px}
  .backbtn.show{display:flex}
  .topbar h1{font-size:19px;margin:0;line-height:1.25;font-weight:800;letter-spacing:-.02em}
  .topbar p{margin:2px 0 0;font-size:12.5px;color:var(--muted)}
  .tg-badge{margin-left:auto;flex:0 0 auto;font-size:11px;font-weight:700;padding:6px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);color:var(--muted);display:inline-flex;align-items:center;gap:6px}
  .tg-badge::before{content:"";width:6px;height:6px;border-radius:50%;background:#cbd5e1;display:block}
  .tg-badge.on{background:#ecfdf5;color:#059669;border-color:#a7f3d0}
  .tg-badge.on::before{background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
  @media (prefers-color-scheme: dark){ .tg-badge.on{background:#123526;color:#5fd68d} }
  main{flex:1;padding:4px 16px 12px}
  main.flush{padding:0}
  .view{display:none}
  .view.active{display:block}
  /* HOME - app icon launcher — soft pastel tiles with a subtle pattern */
  .intro{margin:14px 0 4px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:22px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .intro::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);background-size:18px 18px;pointer-events:none}
  .intro::after{content:"";position:absolute;right:-46px;top:-46px;width:150px;height:150px;border-radius:50%;border:26px solid var(--accent-soft);opacity:.55;pointer-events:none}
  .intro h2{font-size:26px;line-height:1.22;margin:0 0 8px;letter-spacing:-.03em;font-weight:800;position:relative;z-index:1}
  .intro p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.6;position:relative;z-index:1;max-width:42ch}
  .launcher-label{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:24px 2px 14px}
  .launcher{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .launcher-app{border:0;background:transparent;padding:0;text-align:center;color:var(--ink);-webkit-tap-highlight-color:transparent}
  .launcher-app:active .app-icon-big{transform:scale(.94)}
  .launcher-app:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:32px}
  /* Squircle app icon — pale tinted tile, dot pattern, white glyph chip */
  .app-icon-big{
    width:100%;aspect-ratio:1/1;
    border-radius:32px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
    position:relative;overflow:hidden;isolation:isolate;
    border:1px solid var(--line);
    transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s ease;
  }
  .app-icon-big.free{
    background-color:var(--free-tile-2);
    background-image:radial-gradient(var(--free-dot) 1.4px,transparent 1.4px),linear-gradient(160deg,var(--free-tile) 0%,var(--free-tile-2) 78%);
    background-size:16px 16px,100% 100%;
    box-shadow:0 1px 2px rgba(51,104,158,.06),0 12px 26px rgba(51,104,158,.10);
  }
  .app-icon-big.gallery{
    background-color:var(--gal-tile-2);
    background-image:radial-gradient(var(--gal-dot) 1.4px,transparent 1.4px),linear-gradient(160deg,var(--gal-tile) 0%,var(--gal-tile-2) 78%);
    background-size:16px 16px,100% 100%;
    box-shadow:0 1px 2px rgba(184,90,65,.06),0 12px 26px rgba(184,90,65,.10);
  }
  /* soft ring deco, like a pattern motif in the corner */
  .app-icon-big::after{content:"";position:absolute;right:-34px;bottom:-34px;width:104px;height:104px;border-radius:50%;border:18px solid rgba(255,255,255,.5);z-index:1;pointer-events:none}
  @media (prefers-color-scheme: dark){ .app-icon-big::after{border-color:rgba(255,255,255,.07)} }
  .app-icon-big .glyph{width:72px;height:72px;position:relative;z-index:3;display:grid;place-items:center;background:#fff;border-radius:22px;padding:13px;box-shadow:0 2px 6px rgba(28,31,36,.07),0 10px 22px rgba(28,31,36,.08)}
  @media (prefers-color-scheme: dark){ .app-icon-big .glyph{background:#f4f4f0} }
  .app-icon-big .glyph svg{width:100%;height:100%;display:block}
  .app-icon-big .badge{position:relative;z-index:3;font-size:11px;font-weight:700;letter-spacing:.02em;background:rgba(255,255,255,.92);color:#2b2f36;padding:5px 10px;border-radius:999px;box-shadow:0 2px 8px rgba(28,31,36,.08);display:inline-flex;align-items:center;gap:5px;line-height:1}
  .app-icon-big .badge i{width:6px;height:6px;border-radius:50%;background:#4cb877;display:block;flex:0 0 auto}
  .app-icon-big.gallery .badge i{background:#e0685a}
  .app-icon-big .count{position:absolute;top:12px;right:12px;z-index:4;background:#fff;color:#2b2f36;font-size:12px;font-weight:800;min-width:28px;height:28px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 8px;box-shadow:0 2px 8px rgba(28,31,36,.10);border:1px solid var(--line);font-variant-numeric:tabular-nums}
  .launcher-app h3{margin:12px 0 3px;font-size:16px;font-weight:700;letter-spacing:-.01em}
  .launcher-app p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5;padding:0 6px}
  /* Quick list — tinted squircle tiles */
  .quick-list{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:24px;overflow:hidden;box-shadow:var(--shadow)}
  .quick-row{width:100%;display:flex;align-items:center;gap:14px;padding:14px 16px;border:0;border-bottom:1px solid var(--line);background:var(--surface);text-align:left;color:var(--ink)}
  .quick-row:last-child{border-bottom:0}
  .quick-row:active{background:var(--surface2)}
  .quick-row .qicon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;position:relative;overflow:hidden;border:1px solid var(--line)}
  .quick-row .qicon svg{width:26px;height:26px;display:block}
  .quick-row .qicon.f{background-color:var(--free-tile);background-image:radial-gradient(var(--free-dot) 1.2px,transparent 1.2px);background-size:11px 11px;color:var(--free-ink)}
  .quick-row .qicon.g{background-color:var(--gal-tile);background-image:radial-gradient(var(--gal-dot) 1.2px,transparent 1.2px);background-size:11px 11px;color:var(--gal-ink)}
  .quick-row b{font-size:15px;display:block;font-weight:700;letter-spacing:-.01em}
  .quick-row span{font-size:12.5px;color:var(--muted);display:block;margin-top:2px;line-height:1.4}
  .quick-row .chev{margin-left:auto;color:#cbd5e1;font-size:22px;font-weight:300;line-height:1}
  @media (prefers-color-scheme: dark){ .quick-row .chev{color:#475569} }
  .home-note{margin-top:14px;font-size:13px;line-height:1.65;color:var(--muted);padding:0 2px}
  /* DATA EXPLAINER — how the Inven posts get in */
  .data-card{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .data-card::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);background-size:16px 16px;pointer-events:none}
  .data-card h3{margin:0 0 8px;font-size:14.5px;font-weight:800;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;position:relative}
  .data-card h3 .dic{width:26px;height:26px;border-radius:8px;background:var(--accent-soft);color:var(--accent-dark);display:inline-grid;place-items:center;flex:0 0 auto}
  .data-card h3 .dic svg{width:15px;height:15px;display:block}
  .data-card p{margin:0;font-size:13px;line-height:1.7;color:var(--muted);position:relative}
  .data-card p b{color:var(--ink)}
  .data-card .when{margin-top:10px;display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;background:var(--surface2);border:1px solid var(--line);color:var(--ink);padding:6px 10px;border-radius:999px;position:relative}
  .data-card .when i{width:6px;height:6px;border-radius:50%;background:var(--ok);display:block}
  /* PHONE HOME SCREEN — status bar, wallpaper, widget, app grid */
  .statusbar{display:flex;align-items:center;justify-content:space-between;padding:12px 22px 2px;font-size:14.5px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
  .statusbar .sb-icons{display:inline-flex;align-items:center;gap:6px;color:var(--ink)}
  .statusbar .sb-icons svg{display:block}
  @media (min-width:760px){
    body{padding-top:26px}
    .shell{border:1.5px solid var(--line);border-radius:44px;box-shadow:0 30px 80px rgba(28,31,36,.16),0 4px 16px rgba(28,31,36,.08);overflow:clip;min-height:calc(100dvh - 26px)}
  }
  .wallpaper{margin-top:10px;border:1px solid var(--line);border-radius:30px;padding:24px 18px 18px;position:relative;overflow:hidden;background:linear-gradient(165deg,#edf3f9 0%,#f8f4ec 52%,#edf4ef 100%);box-shadow:var(--shadow)}
  .wallpaper::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:17px 17px;pointer-events:none}
  .wallpaper::after{content:"";position:absolute;right:-52px;top:-52px;width:160px;height:160px;border-radius:50%;border:26px solid rgba(255,255,255,.5);pointer-events:none}
  @media (prefers-color-scheme: dark){
    .wallpaper{background:linear-gradient(165deg,#1e2833 0%,#27251f 52%,#202b25 100%)}
    .wallpaper::after{border-color:rgba(255,255,255,.06)}
  }
  .widget{position:relative;z-index:1;text-align:center;padding:6px 0 22px}
  .widget .wtime{font-size:58px;font-weight:800;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
  .widget .wdate{margin-top:9px;font-size:15px;color:var(--muted);font-weight:600}
  .appgrid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(4,1fr);gap:20px 8px}
  .papp{border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;gap:7px;color:var(--ink);-webkit-tap-highlight-color:transparent;min-height:0}
  .papp:active .picon{transform:scale(.92)}
  .papp:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:20px}
  .picon{width:62px;height:62px;border-radius:18px;display:grid;place-items:center;position:relative;border:1px solid var(--line);transition:transform .15s cubic-bezier(.34,1.56,.64,1);box-shadow:0 2px 6px rgba(28,31,36,.05),0 8px 18px rgba(28,31,36,.06)}
  .picon svg{width:32px;height:32px;display:block}
  .picon.t-free{background-color:var(--free-tile-2);background-image:radial-gradient(var(--free-dot) 1.3px,transparent 1.3px);background-size:13px 13px;color:var(--free-ink)}
  .picon.t-gal{background-color:var(--gal-tile-2);background-image:radial-gradient(var(--gal-dot) 1.3px,transparent 1.3px);background-size:13px 13px;color:var(--gal-ink)}
  .picon.t-clock{background-color:#e4f0ea;background-image:radial-gradient(rgba(53,112,92,.14) 1.3px,transparent 1.3px);background-size:13px 13px;color:#35705c}
  .picon.t-calc{background-color:#e9ecf1;background-image:radial-gradient(rgba(76,90,110,.13) 1.3px,transparent 1.3px);background-size:13px 13px;color:#4c5a6e}
  @media (prefers-color-scheme: dark){
    .picon.t-clock{background-color:#22322b;color:#9fd3ba}
    .picon.t-calc{background-color:#272c34;color:#b3c0d2}
    .picon.t-bsky{background-color:#1c2f47;color:#8db8ea}
    .picon.t-x{background-color:#17191d;color:#e8eaed}
    .picon.t-watch{background-color:#3a2226;color:#f2a5a0}
    .picon.t-nimi{background-color:#2a2140;color:#c4b5fd}
    .picon.t-uni{background-color:#2e2140;color:#c4b5fd}
  }
  .picon.t-cal{background:#fff;color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;line-height:1}
  .picon.t-bsky{background-color:#d9eafc;background-image:radial-gradient(rgba(29,111,209,.14) 1.3px,transparent 1.3px);background-size:13px 13px;color:#1d6fd1}
  .picon.t-x{background-color:#e9eaec;background-image:radial-gradient(rgba(28,31,36,.14) 1.3px,transparent 1.3px);background-size:13px 13px;color:#14161a}
  .picon.t-watch{background-color:#fdeceb;background-image:radial-gradient(rgba(192,57,43,.14) 1.3px,transparent 1.3px);background-size:13px 13px;color:#c0392b}
  .picon.t-nimi{background-color:#ede9fe;background-image:radial-gradient(rgba(124,92,255,.14) 1.3px,transparent 1.3px);background-size:13px 13px;color:#5b45d6}
  .picon.t-uni{background-color:#f3e8fd;background-image:radial-gradient(rgba(124,58,237,.14) 1.3px,transparent 1.3px);background-size:13px 13px;color:#6d28d9}
  .picon.t-cal .cal-dow{font-size:10.5px;font-weight:800;color:var(--coral);letter-spacing:.04em}
  .picon.t-cal .cal-day{font-size:25px;font-weight:800;letter-spacing:-.02em;margin-top:2px}
  .papp .plabel{font-size:12px;font-weight:600;letter-spacing:-.01em;text-align:center;line-height:1.3}
  .pcount{position:absolute;top:-7px;right:-7px;background:#e0685a;color:#fff;font-size:11.5px;font-weight:800;min-width:22px;height:22px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 6px;border:2px solid #f6f3ec;font-variant-numeric:tabular-nums;z-index:2}
  @media (prefers-color-scheme: dark){ .pcount{border-color:#22252a} }
  .wall-dots{display:flex;gap:6px;justify-content:center;margin-top:22px;position:relative;z-index:1}
  .wall-dots i{width:7px;height:7px;border-radius:50%;background:rgba(28,31,36,.22);display:block}
  .wall-dots i:first-child{background:var(--ink)}
  @media (prefers-color-scheme: dark){ .wall-dots i{background:rgba(255,255,255,.25)} .wall-dots i:first-child{background:#f2f2ee} }
  /* PHONE HOME — drag reorder + app drawer + calculator cipher glitch */
  .papp{cursor:grab;touch-action:pan-y;user-select:none;-webkit-user-select:none}
  /* home-grid icons are dragged, not scrolled: the browser must not steal
     a held touch as a page scroll (pointercancel) mid-drag. Drawer
     clones keep pan-y (they are tapped, never dragged). */
  #view-home .appgrid .papp{touch-action:none}
  .papp.dragging{cursor:grabbing;z-index:60;opacity:.97;touch-action:none;will-change:transform}
  .papp.dragging .picon{box-shadow:0 22px 44px rgba(28,31,36,.34),0 4px 10px rgba(28,31,36,.18)}
  .appgrid .papp:not(.dragging){transition:transform .18s ease}
  .drag-placeholder{border:2px dashed var(--accent);border-radius:18px;opacity:.55;box-sizing:border-box}
  .papp.drag-target .picon{outline:2px dashed var(--accent);outline-offset:3px}
  #drawerHandle{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom));z-index:35;display:none;flex-direction:column;align-items:center;gap:3px;border:0;background:transparent;padding:8px 16px 4px;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:-.01em}
  #drawerHandle.show{display:flex}
  #drawerHandle .dh-pill{width:44px;height:5px;border-radius:999px;background:rgba(28,31,36,.35);display:block}
  @media (prefers-color-scheme: dark){ #drawerHandle .dh-pill{background:rgba(255,255,255,.35)} }
  body.drawer-open #drawerHandle{display:none}
  #appDrawer{position:fixed;inset:0;z-index:55;background:var(--bg);transform:translateY(103%);transition:transform .32s cubic-bezier(.32,.72,.24,1);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom));visibility:hidden}
  #appDrawer.open{transform:translateY(0);visibility:visible}
  .drawer-head{display:flex;align-items:center;gap:10px;padding:4px 2px 16px}
  .drawer-head .dh-grip{width:44px;height:5px;border-radius:999px;background:rgba(28,31,36,.3);display:block;margin:0 auto}
  .drawer-head h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.02em;flex:1}
  .drawer-close{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:17px;line-height:1;font-weight:700}
  .drawer-note{margin:14px 2px 0;font-size:12.5px;color:var(--muted);line-height:1.6;text-align:center}
  .ditem{position:relative}
  .drawer-toggle{position:absolute;top:-6px;right:4px;z-index:3;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-size:15px;font-weight:900;line-height:1;display:grid;place-items:center;box-shadow:0 2px 6px rgba(28,31,36,.14);padding:0}
  .drawer-toggle.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .home-empty{display:none;margin:26px 8px 0;padding:16px;border:1.5px dashed var(--line);border-radius:16px;text-align:center;color:var(--muted);font-size:13.5px;font-weight:600;line-height:1.6;position:relative;z-index:1}
  .home-empty.show{display:block}
  .nimi-frame{width:100%;height:560px;border:1px solid var(--line);border-radius:16px;background:#fff;display:block}
  .calc-disp.glitch{animation:calcGlitch .4s steps(2,end)}
  @keyframes calcGlitch{0%{transform:translateX(0);text-shadow:2px 0 #e0685a,-2px 0 #1d6fd1}25%{transform:translateX(-3px);text-shadow:-2px 0 #e0685a,2px 0 #1d6fd1}50%{transform:translateX(3px);opacity:.6}75%{transform:translateX(-2px)}100%{transform:translateX(0);text-shadow:none}}
  /* CLOCK APP */
  .clock-face{text-align:center;padding:40px 16px 34px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .clock-face::before{content:"";position:absolute;inset:0;background-image:radial-gradient(var(--dot) 1.1px,transparent 1.1px);background-size:16px 16px;pointer-events:none}
  .clock-face .ctime{font-size:54px;font-weight:800;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05;position:relative}
  .clock-face .cdate{margin-top:10px;color:var(--muted);font-size:15px;font-weight:600;position:relative}
  /* CALENDAR APP */
  .cal-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:18px 16px}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
  .cal-head b{font-size:17px;letter-spacing:-.01em}
  .cal-head button{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--ink);font-size:19px;line-height:1}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
  .cal-grid .dow{font-size:11.5px;color:var(--muted);font-weight:700;padding:6px 0}
  .cal-grid .dow.sun{color:var(--coral)}
  .cal-grid .day{padding:9px 0;font-size:14px;border-radius:10px;font-variant-numeric:tabular-nums}
  .cal-grid .day.today{background:var(--ink);color:var(--bg);font-weight:800}
  .cal-grid .day.dim{color:var(--muted);opacity:.4}
  .cal-today-btn{margin-top:14px;width:100%;border:1px solid var(--line);background:var(--surface2);color:var(--ink);border-radius:12px;font-weight:800;padding:11px}
  /* CALCULATOR APP */
  .calc-card{background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:16px}
  .calc-disp{background:var(--surface2);border:1px solid var(--line);border-radius:16px;padding:18px 16px;font-size:34px;font-weight:800;text-align:right;min-height:78px;display:flex;align-items:center;justify-content:flex-end;font-variant-numeric:tabular-nums;word-break:break-all;letter-spacing:-.01em}
  .calc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
  .calc-grid button{border:1px solid var(--line);background:var(--surface);border-radius:14px;font-size:19px;font-weight:700;padding:13px 0;color:var(--ink);min-height:52px}
  .calc-grid button:active{background:var(--surface2)}
  .calc-grid button.op{background:var(--accent-soft);color:var(--accent-dark);border-color:transparent}
  .calc-grid button.eq{background:var(--ink);color:var(--bg);border-color:transparent}
  /* DOCK — floating modern tab bar */
  .dock{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom));z-index:40;width:min(520px,calc(100% - 24px));background:color-mix(in srgb,var(--surface) 88%,transparent);-webkit-backdrop-filter:blur(20px) saturate(1.6);backdrop-filter:blur(20px) saturate(1.6);border:1px solid color-mix(in srgb,var(--line) 70%,transparent);box-shadow:0 12px 32px rgba(15,23,42,.14),0 2px 8px rgba(15,23,42,.06),inset 0 1px 0 rgba(255,255,255,.6);border-radius:28px;display:grid;grid-template-columns:1fr 1fr 1fr;padding:6px;gap:2px}
  @media (prefers-color-scheme: dark){ .dock{box-shadow:0 12px 32px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.08)} }
  .dock button{border:0;background:transparent;border-radius:22px;padding:6px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:11px;font-weight:600;min-height:60px;letter-spacing:-.01em;transition:background .15s,color .15s}
  .dock button .dicon{width:28px;height:28px;display:grid;place-items:center;line-height:1}
  .dock button .dicon svg{width:24px;height:24px;display:block}
  .dock button .dicon-wrap{width:44px;height:28px;border-radius:999px;display:grid;place-items:center;transition:background .15s,transform .15s}
  .dock button.on{color:var(--ink)}
  .dock button.on .dicon-wrap{background:var(--ink);color:var(--bg)}
  .dock button#dockFree.on .dicon-wrap{background:var(--free-tile);color:var(--free-ink)}
  .dock button#dockGallery.on .dicon-wrap{background:var(--gal-tile);color:var(--gal-ink)}
  .dock button#dockHome.on .dicon-wrap{background:var(--ink);color:var(--bg)}
  /* FREE MODEL APP */
  .model-head{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
  .model-head h2{margin:0 0 4px;font-size:19px}
  .model-head p{margin:0;color:var(--muted);font-size:13.5px;line-height:1.55}
  .model-chips{display:flex;gap:8px;overflow-x:auto;padding:12px 2px 4px;scrollbar-width:none}
  .model-chips::-webkit-scrollbar{display:none}
  .mchip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 14px;font-weight:800;font-size:13.5px}
  .mchip.on{border-color:var(--teal);background:#e6f7f4;color:#067a6f}
  @media (prefers-color-scheme: dark){ .mchip.on{background:#0f2f2c;color:#5eead4} }
  .model-cards{display:grid;gap:10px;margin-top:12px}
  .model-card{width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:14px;display:flex;gap:12px;align-items:center;color:var(--ink)}
  .model-card.on{border-color:var(--teal)}
  .model-card .mic{width:48px;height:48px;border-radius:14px;background-color:var(--free-tile);background-image:radial-gradient(var(--free-dot) 1.2px,transparent 1.2px);background-size:11px 11px;color:var(--free-ink);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
  .model-card .mic svg{width:26px;height:26px;display:block}
  .model-card .mic.alt{background-color:var(--accent-soft);background-image:radial-gradient(var(--free-dot) 1.2px,transparent 1.2px);color:var(--accent-dark)}
  .model-card b{font-size:15px}
  .model-card span{font-size:12.5px;color:var(--muted);display:block;margin-top:2px;line-height:1.45}
  .model-card .free-pill{margin-left:auto;flex:0 0 auto;font-size:11px;font-weight:900;background:#e6f7ee;color:var(--ok);padding:5px 8px;border-radius:999px}
  .chatbox{margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow)}
  .chat-log{padding:14px;display:flex;flex-direction:column;gap:10px;min-height:210px;max-height:360px;overflow:auto}
  .msg{max-width:88%;padding:10px 12px;border-radius:16px;font-size:14.5px;line-height:1.55;white-space:pre-wrap;word-break:break-word}
  .msg.bot{background:var(--surface2);align-self:flex-start;border-bottom-left-radius:6px}
  .msg.me{background:#6ea3cf;color:#fff;align-self:flex-end;border-bottom-right-radius:6px}
  @media (prefers-color-scheme: dark){ .msg.me{background:#3d6a94} }
  .msg.err{background:var(--coral-soft);color:var(--ink);align-self:flex-start;border-bottom-left-radius:6px}
  .msg .retry{display:block;margin-top:8px;border:0;border-radius:10px;background:var(--coral);color:#fff;font-weight:800;font-size:13px;padding:8px 14px;min-height:40px}
  .msg.typing{color:var(--muted)}
  .msg.typing .dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin-right:3px;animation:blink 1s infinite}
  .msg.typing .dots i:nth-child(2){animation-delay:.2s}
  .msg.typing .dots i:nth-child(3){animation-delay:.4s}
  @keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){ .msg.typing .dots i{animation:none} }
  .chat-input{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line);background:var(--surface)}
  .chat-input input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:10px 12px;font-size:15px}
  .chat-input button{border:0;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:800;padding:10px 16px;background:var(--accent);color:#fff}
  .chat-note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:10px;padding:0 2px}
  /* OPEN GALLERY - scrollable list with body previews */
  .gallery-top{display:flex;align-items:center;gap:8px;padding:10px 16px 8px}
  .gallery-top h2{margin:0;font-size:17px}
  .gallery-top .live{font-size:11px;font-weight:900;background:var(--gal-tile);color:var(--gal-ink);padding:4px 8px;border-radius:999px}
  .gallery-top .counter{margin-left:auto;font-size:13px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
  .auto-head{display:flex;align-items:baseline;gap:8px;padding:14px 16px 4px}
  .auto-head h3{margin:0;font-size:15px;font-weight:800;letter-spacing:-.01em}
  .auto-head span{font-size:12px;color:var(--muted)}
  /* 통합 피드 (TikTok식) — vertical snap feed, one post per screen.
     The feed container gets its height from JS (viewport minus the
     header/dock); each slide fills it and snaps. Cards reuse the
     normal builders, restyled to fill the slide: media flexes to
     fill, the body sits at the bottom. Videos cover the media area,
     images contain (never cropped). */
  .uni-feed{overflow-y:auto;scroll-snap-type:y mandatory;overscroll-behavior:contain;border-radius:20px;background:#0c0d10;margin:0 16px;height:calc(100dvh - 330px);min-height:420px}
  .uni-slide{height:100%;scroll-snap-align:start;scroll-snap-stop:always;display:flex;min-height:0;position:relative}
  .uni-slide .post-card{flex:1;min-height:0;display:flex;flex-direction:column;border:0;border-radius:0;box-shadow:none}
  .uni-slide .media-stack{flex:1;min-height:0}
  .uni-slide .post-media{flex:1;min-height:0;display:flex}
  .uni-slide .post-media img,.uni-slide .post-media video{flex:1;min-height:0;width:100%;height:100%;max-height:none;object-fit:contain}
  .uni-slide .post-media video{object-fit:cover}
  .uni-slide .post-body{flex:0 0 auto}
  .uni-heart{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.4);opacity:0;pointer-events:none;z-index:5;color:#fff;filter:drop-shadow(0 4px 14px rgba(0,0,0,.5))}
  .uni-heart svg{width:84px;height:84px;display:block}
  .uni-heart.pop{animation:uniHeartPop .8s ease forwards}
  @keyframes uniHeartPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.4)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}45%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-60%) scale(1.05)}}
  .gfilters{display:flex;gap:8px;padding:0 16px 10px}
  /* GALLERY TABS — the search box sits at the top of the view, always
     visible (same .bsky-search pattern as Bluesky/X); searching shows
     the search pane (status + results) instead of the feed. The keyword
     chips are feed-only; the search pane and the all pane (status +
     results) show instead of the feed on their modes. The media chips
     and sound bar are shared by all three modes. */
  #view-gallery.in-search #gFilters{display:none}
  #view-gallery.in-search #feed{display:none}
  #view-gallery.in-search #snapInfo{display:none}
  #searchPane{display:none}
  #view-gallery.in-search #searchPane{display:block}
  #view-gallery.in-all #gFilters{display:none}
  #view-gallery.in-all #feed{display:none}
  #view-gallery.in-all #snapInfo{display:none}
  #allPane{display:none}
  #view-gallery.in-all #allPane{display:block}
  #view-gallery.in-bkmk #gFilters{display:none}
  #view-gallery.in-bkmk #feed{display:none}
  #view-gallery.in-bkmk #snapInfo{display:none}
  #bkmkPane{display:none}
  #view-gallery.in-bkmk #bkmkPane{display:block}
  .search-status{font-size:13px;color:var(--muted);line-height:1.5;padding:0 16px 10px}
  .gchip{border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:8px 16px;font-weight:900;font-size:14px;min-height:40px}
  .gchip.on{background:#111;color:#fff;border-color:#111}
  @media (prefers-color-scheme: dark){ .gchip.on{background:#fff;color:#111;border-color:#fff} }
  .post-card.seen{opacity:.55}
  .ftag.seen-tag{background:var(--ink);color:var(--bg);border-color:transparent}
  .post-list{display:flex;flex-direction:column;gap:14px;padding:2px 16px 4px}
  .post-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:var(--shadow);color:var(--ink)}
  .post-media{position:relative;background:#0c0d10}
  .post-media img,.post-media video{display:block;width:100%;height:auto;max-height:76dvh;object-fit:contain;background:#0c0d10}
  .media-stack{display:flex;flex-direction:column;gap:2px;background:#0c0d10}
  .post-media .kind{position:absolute;left:10px;top:10px;background:rgba(20,22,26,.8);color:#fff;font-size:11.5px;font-weight:800;padding:5px 10px;border-radius:999px;line-height:1.3;pointer-events:none}
  .post-media .vhint{position:absolute;right:10px;bottom:10px;background:rgba(20,22,26,.78);color:#fff;font-size:11px;font-weight:700;padding:5px 9px;border-radius:999px;line-height:1.3;pointer-events:none}
  .sound-bar{display:flex;align-items:center;gap:10px;padding:0 16px 12px}
  .sound-btn{display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:9px 15px;font-weight:900;font-size:13.5px;min-height:42px;flex:0 0 auto}
  .sound-btn svg{width:17px;height:17px;display:block}
  .sound-btn.on{background:#111;color:#fff;border-color:#111}
  @media (prefers-color-scheme: dark){ .sound-btn.on{background:#fff;color:#111;border-color:#fff} }
  .sound-note{font-size:12px;color:var(--muted);line-height:1.45}
  .post-body{padding:10px 14px 12px}
  .feed-tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .ftag{font-size:12px;font-weight:900;padding:6px 10px;border-radius:999px;background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
  .ftag.hot{background:#e8836f;color:#fff;border-color:transparent}
  .ftag.cat{background:transparent;color:var(--muted)}
  .post-card h3{margin:0;font-size:15.5px;line-height:1.4;letter-spacing:-.01em;font-weight:700;word-break:keep-all}
  .post-card h3 a{color:inherit;text-decoration:none}
  .post-excerpt{margin-top:10px;font-size:14px;line-height:1.65;background:var(--surface2);border-radius:12px;padding:11px 13px;word-break:break-word}
  .post-excerpt .ex-label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:2px}
  .post-excerpt .ex-none{color:var(--muted)}
  .feed-meta{margin-top:7px;font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 10px;line-height:1.5}
  .post-open{margin-top:10px;display:flex;align-items:center;justify-content:center;width:100%;text-align:center;text-decoration:none;font-weight:700;font-size:13px;border-radius:11px;padding:9px 10px;min-height:40px;background:var(--surface2);color:var(--ink);border:1px solid var(--line)}
  /* BOOKMARK — one icon button per card, same style in Gallery/Bluesky/X.
     It sits next to the 원문 보기 link (never inside it), so it cannot
     trigger the link, the image fullsize tap, or the gallery's 1s-dwell

  .bkmk-row{display:flex;align-items:center;gap:8px;margin-top:10px}

  .bkmk-btn,.hide-btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);color:var(--muted);border-radius:999px;padding:9px 13px;font-weight:800;font-size:13px;min-height:40px;flex:0 0 auto}

  .taste-note{font-size:12px;color:var(--muted);line-height:1.45}
  .taste-hint{background:var(--accent-soft);border:1px solid var(--line);border-radius:16px;padding:13px 15px;margin-bottom:12px;display:flex;flex-direction:column;gap:3px}

  .taste-hint span{font-size:13px;color:var(--muted);line-height:1.55}
  /* 관심없음 되돌리기 토스트 — fixed above the dock, 5s. */
  .hide-toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom));z-index:60;background:var(--ink);color:var(--bg);border-radius:14px;padding:12px 14px;display:none;align-items:center;gap:12px;box-shadow:0 12px 32px rgba(0,0,0,.28);font-size:13.5px;font-weight:700;max-width:calc(100% - 32px)}

  .hide-manage-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px}

  .hide-manage-head span{font-size:12.5px;color:var(--muted);font-weight:700}

  .hide-block-list{margin-top:12px;display:flex;flex-direction:column;gap:6px}

var EXPAND = { 'ㅇㅎ':['약후'], 'ㅎㅂ':['후방'] };
function matchInfo(post){
  var hits=[];
  ['ㅇㅎ','ㅎㅂ'].forEach(function(kw){
    if (post.title.indexOf(kw)!==-1) hits.push({kw:kw, via:kw, literal:true});
    else if (EXPAND[kw]) EXPAND[kw].forEach(function(v){ if(post.title.indexOf(v)!==-1) hits.push({kw:kw, via:v, literal:false}); });
  });
  return hits;
}

/* SHUFFLE — Fisher-Yates, in place. Feeds shuffle on every FRESH fetch
   (gallery 피드/전체, Bluesky 인기, X search) so every open shows a
   different order; search results (gallery top-box search, Bluesky
   search) stay newest-first and are never shuffled. Cached lists are
   re-shuffled on re-open (전체 tab, X view) without a new fetch. */
function shuffleInPlace(arr){
  for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
/* NIMI AUTO FEED — the SAME whats-hot video feed as the watch app
   (fetchBskyHotVideos), rendered ABOVE the Nimi iframe, gallery
   pattern: content is just there and autoplays; the user pastes
   nothing into the hub. The Nimi iframe below stays exactly as-is
   (its own input for Nimi's features; its watch links still open a
   new tab by Nimi's design — nothing here intercepts them). Own
   observer + 소리 켜기 toggle, mirroring the watch app. */
var nimiFeedLoading=false;
var nimiFeedLoaded=false;
var nimiVideos=[];
var nimiVidObserver=null;
var nimiSoundOn=false;
var nimiCursor=null;
/* whats-hot pagination for the auto feed's "more" */
var nimiSearchMode='hot';
/* 'hot' = auto feed, 'search' = keyword search results */
var nimiSearchQuery='';
var nimiLoadingMore=false;
/* NIMI FEED "MORE" — bookmarking pulls a fresh batch and appends only
   posts not shown yet (hot: next page via cursor; search: same query
   again). The list is then re-ranked by taste (hot feed only — search
   results stay newest-first). */
function nimiAppendPosts(posts){
  var feed=document.getElementById('nimiFeed');
  if(!feed) return 0;
  var seen={};
  Array.prototype.slice.call(feed.querySelectorAll('.post-card')).forEach(function(c){ seen[c.getAttribute('data-post-uri')]=true; });
  var added=0;
  posts.forEach(function(p){
    if(seen[p.uri]) return;
    seen[p.uri]=true;
    feed.appendChild(bskyBuildCard(p));
    added++;
  });
  if(added) setupNimiVideos();
  return added;
}
function nimiFetchMore(){
  if(!nimiFeedLoaded || nimiLoadingMore || nimiFeedLoading) return;
  nimiLoadingMore=true;
  if(nimiSearchMode==='search'){
    var q=nimiSearchQuery;
    fetch(BSKY_API+'/app.bsky.feed.searchPosts?q='+encodeURIComponent(q)+'&limit=25&sort=latest').then(function(res){
      if(!res.ok) throw new Error('HTTP '+res.status);
      return res.json();
    }).then(function(data){
      nimiLoadingMore=false;
      var out=[];
      var raw=(data && Array.isArray(data.posts))?data.posts:[];
      raw.forEach(function(p){
        var n=bskyNormalize(p);
        if(!n) return;
        if(!(n.media||[]).some(function(m){ return m.type==='video'; })) return;
        if(isHiddenOrBlocked('bsky', n.uri||n.id, n.handle)) return;
        out.push(n);
      });
      nimiAppendPosts(out);
    }).catch(function(){ nimiLoadingMore=false; });
    return;
  }
  fetchBskyHotVideos(function(res){
    nimiLoadingMore=false;
    if(res.error) return;
    nimiCursor=res.cursor||nimiCursor;
    if(nimiAppendPosts(res.posts)) nimiRerank();
  }, nimiCursor);
}
/* NIMI FEED RE-RANK — reorder the auto feed's cards in place by taste
   score (similar first), keeping the card currently in view on screen.
   Search results are exempt (newest-first). No-op before the feed
   loads or with no bookmarks. */
function nimiRerank(){
  var feed=document.getElementById('nimiFeed');
  if(!feed || !nimiFeedLoaded || nimiSearchMode==='search') return;
  var prof=tasteProfile('bsky');
  if(!prof) return;
  var cards=Array.prototype.slice.call(feed.querySelectorAll('.post-card'));
  if(cards.length<2) return;
  var cur=null;
  cards.forEach(function(c){
    var r=c.getBoundingClientRect();
    if(r.top<window.innerHeight*0.6 && r.bottom>window.innerHeight*0.4) cur=c;
  });
  cards.sort(function(a,b){
    var pa=bkmkPostCache['bsky:'+(a.getAttribute('data-post-uri')||'')];
    var pb=bkmkPostCache['bsky:'+(b.getAttribute('data-post-uri')||'')];
    var sa=pa?tasteScore(pa.handle, pa.text, bskyMediaTypes(pa), prof):0;
    var sb=pb?tasteScore(pb.handle, pb.text, bskyMediaTypes(pb), prof):0;
    return sb-sa;
  });
  cards.forEach(function(c){ feed.appendChild(c); });
  if(cur) cur.scrollIntoView({block:'center'});
}
function applyNimiSound(){
  nimiVideos.forEach(function(v){
    v.muted = !(nimiSoundOn && v.getAttribute('data-inview')==='1' && v.getAttribute('data-audio')==='1');
  });
  var btn=document.getElementById('nimiSoundToggle');
  if(btn){ btn.classList.toggle('on', nimiSoundOn); btn.setAttribute('aria-pressed', nimiSoundOn?'true':'false'); }
  var label=document.getElementById('nimiSoundLabel'); if(label) label.textContent=nimiSoundOn?'소리 끄기':'소리 켜기';
  var note=document.getElementById('nimiSoundNote');
  if(note) note.textContent=nimiSoundOn?'소리가 켜졌어요. 화면에 보이는 영상의 소리가 납니다.':'영상은 목록에서 바로 자동재생돼요. 소리는 이 버튼을 한 번 누르면 켜집니다.';
}
function setupNimiVideos(){
  nimiVideos=Array.prototype.slice.call(document.querySelectorAll('#nimiFeed .bsky-video'));
  if(nimiVidObserver){ nimiVidObserver.disconnect(); nimiVidObserver=null; }
  nimiVideos.forEach(function(v){
    if(!v._nimiWired){
      v._nimiWired=true;
      v.addEventListener('click', function(){ if(v.paused) bskyTryPlay(v); });
      v.addEventListener('error', function(){ bskyVideoError(v); });
    }
    bskyUpgradeMp4(v);
  });
  if(!('IntersectionObserver' in window)){
    nimiVideos.forEach(function(v){ v.setAttribute('data-inview','1'); bskyTryPlay(v); });
    applyNimiSound();
    return;
  }
  nimiVidObserver=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      var v=en.target;
      if(en.intersectionRatio>=0.35){ v.setAttribute('data-inview','1'); bskyTryPlay(v); }
      else { v.setAttribute('data-inview','0'); v.pause(); }
    });
    applyNimiSound();
  },{threshold:[0,0.35,0.75]});
  nimiVideos.forEach(function(v){ nimiVidObserver.observe(v); });
  applyNimiSound();
}
/* GALLERY — media-first: each post's actual body photos/videos, kept as separate files in a media/ folder
   next to index.html so they play right here in the list.
   items: ordered body media; t:'v' = mp4 video (a:1 = has an audio track,
   a:0 = silent clip), t:'i' = photo/GIF image (a GIF animates on its own
   inside an <img>, no player needed). poster: first-frame thumbnail. */
var BODY = {
  '2755726':{poster:'media/poster-2755726.jpg', media:'영상 1개', items:[{t:'v', src:'media/2755726-v1.mp4', a:1}]},
  '2755715':{poster:'media/poster-2755715.jpg', media:'영상 5개', items:[{t:'v', src:'media/2755715-v1.mp4', a:0},{t:'v', src:'media/2755715-v2.mp4', a:0},{t:'v', src:'media/2755715-v3.mp4', a:0},{t:'v', src:'media/2755715-v4.mp4', a:0},{t:'v', src:'media/2755715-v5.mp4', a:0}]},
  '2755713':{poster:'media/poster-2755713.jpg', media:'영상 1개', items:[{t:'v', src:'media/2755713-v1.mp4', a:1}]},
  '2755708':{poster:'media/poster-2755708.jpg', media:'영상 1개', items:[{t:'v', src:'media/2755708-v1.mp4', a:1}]},
  '2755707':{poster:'media/poster-2755707.jpg', media:'영상 1개', items:[{t:'v', src:'media/2755707-v1.mp4', a:1}]},
  '2755699':{poster:'media/poster-2755699.jpg', media:'사진 4장 · 영상 2개', items:[{t:'i', src:'media/2755699-p1.jpg'},{t:'i', src:'media/2755699-p2.jpg'},{t:'i', src:'media/2755699-p3.webp'},{t:'i', src:'media/2755699-p4.jpg'},{t:'v', src:'media/2755699-v1.mp4', a:1},{t:'v', src:'media/2755699-v2.mp4', a:1}]}
};
var galleryFilter='all';
var mediaFilter='all';
/* STANDALONE ONLY — the baked BODY snapshot media lives in media/
   next to the HUB's index.html (repo root), and its srcs are relative
   (media/2755726-v1.mp4). This page lives in the unified-feed/
   subfolder, so a relative src 404s here (live: unified-feed/media/…
   → 404, hub-root media/… → 200) and every snapshot gallery video
   shows "미디어를 재생할 수 없습니다." whenever the feed falls back
   to the snapshot (proxy slow/down). Rewrite relative snapshot srcs
   and posters to the hub-root media folder once, at load, so the
   snapshot fallback plays here too. */
(function(){
  try{
    if(location.href.indexOf('/unified-feed/')===-1) return;
    var base=new URL('../media/', location.href).href;
    Object.keys(BODY).forEach(function(id){
      var b=BODY[id]; if(!b) return;
      if(b.poster && b.poster.indexOf('media/')===0) b.poster=base+b.poster;
      (b.items||[]).forEach(function(m){ if(m.src && m.src.indexOf('media/')===0) m.src=base+m.src; });
    });
  }catch(e){}
})();
/* MEDIA-TYPE FILTER — a post matches a media type if the card actually
   shows at least one item of that type: video → 영상, photo whose src is
   a .gif → GIF, any other photo → 이미지. The check mirrors the render
   branches (local BODY items first, then poster, then live media), so a
   snapshot post and a live post classify the same way, and a mixed post
   matches each of its types. Live photo srcs are proxified
   (MEDIA_PROXY + encodeURIComponent), so the .gif test decodes the src
   first — Inven photo URLs also carry a ?MW=800 query after the
   extension. */
function isGifSrc(src){
  src=src||'';
  try{ src=decodeURIComponent(src); }catch(e){}
  return /\.gif(\?|#|$)/i.test(src);
}
function rowMediaTypes(row){
  var types={};
  var b=BODY[row.p.id]||{poster:'', media:'', items:[]};
  var items=null;
  if(b.items && b.items.length) items=b.items.map(function(m){ return {type:m.t==='v'?'video':'photo', src:m.src}; });
  else if(b.poster) items=[{type:'photo', src:b.poster}];
  else if(row.liveMedia && row.liveMedia.length) items=row.liveMedia;
  if(!items) return types;
  items.forEach(function(m){
    if(m.type==='video') types.video=true;
    else if(isGifSrc(m.src)) types.gif=true;
    else types.image=true;
  });
  return types;
}
function rowHasMediaType(row, mf){
  if(mf==='all') return true;
  var t=rowMediaTypes(row);
  if(mf==='video') return !!t.video;
  if(mf==='gif') return !!t.gif;
  if(mf==='image') return !!t.image;
  return true;
}
/* Keyword filter × media-type filter, combined with AND. The home badge
   is NOT touched here — it counts the unseen total (setBadgeCount in
   renderFeed / refreshSeenCounts) and must stay filter-independent. */
function filterGalleryRows(visibleRows){
  var rows=visibleRows;
  if(galleryFilter!=='all') rows=rows.filter(function(r){ return r.hits.some(function(h){ return h.kw===galleryFilter; }); });
  if(mediaFilter!=='all') rows=rows.filter(function(r){ return rowHasMediaType(r, mediaFilter); });
  rows=rows.filter(function(r){ return !isHiddenOrBlocked('inven', r.p.id, r.p.author); });
  rows=applyTasteFilter('inven', rows, function(r){ return r.p.author; }, function(r){ return r.p.title; }, function(r){ return rowMediaTypes(r); });
  return rows;
}
/* SEEN POSTS — a post counts as seen when the user actually LOOKS at it:
   a card visible at >=35% for ~1 second is marked seen, and so is tapping
   the card's "원문에서 전체 보기". Seen ids persist in localStorage (key
   invenSeenIds, JSON array) so they survive app restarts. Seen marking
   ONLY marks: a seen card is dimmed (opacity .55) with a "본 글" tag and
   the home badge drops — it is NEVER hidden or removed from any list
   (feed, 전체, or search). The badge hides entirely when the unseen
   count is 0. */
var SEEN_KEY='invenSeenIds';
function loadSeenIds(){
  try{
    var v=JSON.parse(localStorage.getItem(SEEN_KEY)||'[]');
    return Array.isArray(v)?v.map(function(x){ return String(x); }):[];
  }catch(e){ return []; }
}
var seenIds=loadSeenIds();
function isSeen(id){ return seenIds.indexOf(String(id))!==-1; }
function markSeen(id){
  id=String(id);
  if(seenIds.indexOf(id)===-1){
    seenIds.push(id);
    try{ localStorage.setItem(SEEN_KEY, JSON.stringify(seenIds)); }catch(e){}
  }
  /* Re-render the tab the user is on so the card picks up the dimmed
     style + 본 글 tag right away; the card itself is never removed. */
  if(galleryTab==='search') renderSearch();
  else if(galleryTab==='all') renderAll();
  else renderFeed();
}
function setBadgeCount(n){
  var badge=document.getElementById('galleryCountBadge');
  if(!badge) return;
  badge.textContent=n;
  badge.style.display=n?'':'none';
}
/* Recompute the badge + counter from the current seen set WITHOUT
   re-rendering the feed. Used when a card is marked seen by viewing it:
   the card the user is reading must stay on screen, only the numbers
   move. Mirrors the counting in renderFeed(). */
function refreshSeenCounts(){
  var allRows=currentRowsUnfiltered().filter(function(r){ return !isHiddenOrBlocked('inven', r.p.id, r.p.author); });
  setBadgeCount(allRows.filter(function(r){ return !isSeen(r.p.id); }).length);
  updateGalleryCounter();
}
/* BOOKMARKS — per app, in localStorage, cap 100 (oldest evicted first).
   Keys: bkmk-inven, bkmk-bsky, bkmk-x. Each holds the app's normalized
   post objects, so a 북마크 view renders saved cards exactly like live
   cards (same renderer, lazy media, 원문 보기). A post is keyed by app +
   id (Bluesky: uri). Saved objects are looked up through bkmkPostCache,
   filled when cards render. */
var BKMK_KEYS={inven:'bkmk-inven', bsky:'bkmk-bsky', x:'bkmk-x'};
var BKMK_CAP=100;
var bkmkPostCache={};
function loadBkmks(app){
  try{ var v=JSON.parse(localStorage.getItem(BKMK_KEYS[app])||'[]'); return Array.isArray(v)?v:[]; }catch(e){ return []; }
}
var bkmks={inven:loadBkmks('inven'), bsky:loadBkmks('bsky'), x:loadBkmks('x')};
function bkmkKeyOf(app, post){ return app==='bsky' ? String(post.uri||post.id||'') : String(post.id||''); }
function isBkmked(app, post){ var k=bkmkKeyOf(app,post); if(!k) return false; return bkmks[app].some(function(p){ return bkmkKeyOf(app,p)===k; }); }
function saveBkmks(app){ try{ localStorage.setItem(BKMK_KEYS[app], JSON.stringify(bkmks[app].slice(0,BKMK_CAP))); }catch(e){} }
function toggleBkmk(app, post){
  var k=bkmkKeyOf(app,post); if(!k) return false;
  var idx=-1;
  bkmks[app].forEach(function(p,i){ if(bkmkKeyOf(app,p)===k) idx=i; });
  if(idx!==-1){ bkmks[app].splice(idx,1); saveBkmks(app); return false; }
  bkmks[app].push(post);
  while(bkmks[app].length>BKMK_CAP) bkmks[app].shift();
  saveBkmks(app); return true;
}
function bkmkBtnHtml(app, post){
  var saved=isBkmked(app, post);
  return '<button class="bkmk-btn'+(saved?' on':'')+'" type="button" data-bkmk-app="'+app+'" data-bkmk-key="'+esc(bkmkKeyOf(app,post))+'" aria-pressed="'+(saved?'true':'false')+'" aria-label="북마크"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v17l-7-4.5L5 21V4a1 1 0 0 1 1-1Z"/></svg><span>'+(saved?'저장됨':'북마크')+'</span></button>';
}
/* One delegated click handler for every bookmark button (all three
   apps, all lists): the button is a sibling of the 원문 보기 link, so
   it never triggers the link, the image fullsize tap, or the gallery's
   1s-dwell seen marking. After a toggle, every button for that post
   flips in place (no list re-render, so scroll/video state is kept);
   if the toggle happened inside a 북마크 view and the post was just
   removed, that 북마크 view re-renders so the card leaves the list. */
document.addEventListener('click', function(e){
  var btn=e.target && e.target.closest ? e.target.closest('.bkmk-btn') : null;
  if(!btn) return;
  e.preventDefault(); e.stopPropagation();
  var app=btn.getAttribute('data-bkmk-app');
  var key=btn.getAttribute('data-bkmk-key');
  var post=bkmkPostCache[app+':'+key];
  if(!post || !BKMK_KEYS[app]) return;
  var saved=toggleBkmk(app, post);
  document.querySelectorAll('.bkmk-btn').forEach(function(b){
    if(b.getAttribute('data-bkmk-app')===app && b.getAttribute('data-bkmk-key')===key){
      b.classList.toggle('on', saved);
      b.setAttribute('aria-pressed', saved?'true':'false');
      var sp=b.querySelector('span'); if(sp) sp.textContent=saved?'저장됨':'북마크';
    }
  });
});
/* POST-BOOKMARK HOOK — after ANY bookmark toggle, feeds re-rank live
   (no reload): the unified feed and the Nimi feed reorder their DOM in
   place, and the currently visible feed (Bluesky 인기 / X / 통합 피드 /
   니미) pulls a fresh batch (dedupe, unseen only) so similar + new
   posts keep appearing. Registered AFTER the delegated toggle handler
   above, on the same node: its stopPropagation() does not block
   same-node listeners, so this runs right after the toggle. */
document.addEventListener('click', function(e){
  var btn=e.target && e.target.closest ? e.target.closest('.bkmk-btn') : null;
  if(!btn) return;
  var app=btn.getAttribute('data-bkmk-app');
  if(!app || !BKMK_KEYS[app]) return;
  onBkmkChanged(app);
});
function onBkmkChanged(app){
  if(typeof uniRerank==='function') uniRerank();
  if(typeof nimiRerank==='function') nimiRerank();
  if(currentView==='bsky' && bskyTab==='hot' && typeof bskyFetchMore==='function') bskyFetchMore();
  else if(currentView==='x' && xTab==='search' && typeof xFetchMore==='function') xFetchMore();
  else if(currentView==='uni' && typeof uniFetchMore==='function') uniFetchMore(true);
  else if(currentView==='nimi' && typeof nimiFetchMore==='function') nimiFetchMore();
}
/* HIDE + BLOCK ("관심없음") — per app, in localStorage. Hiding a card
   records its post id AND its author: the author's other posts are
   hidden too, on every list of that app (feed, 전체, search results,
   인기 피드). The 북마크 view is EXEMPT — a bookmarked post is never
   hidden by this, so saved posts stay findable. Caps: 200 entries per
   list, oldest evicted first. The card disappears from the current
   view immediately, with a 5s 되돌리기 toast. */
var HIDE_KEYS={inven:'hide-inven', bsky:'hide-bsky', x:'hide-x'};
var BLOCK_KEYS={inven:'block-inven', bsky:'block-bsky', x:'block-x'};
var HIDE_CAP=200;
function loadStrList(key){
  try{ var v=JSON.parse(localStorage.getItem(key)||'[]'); return Array.isArray(v)?v.map(function(x){ return String(x); }):[]; }catch(e){ return []; }
}
var hiddenIds={inven:loadStrList(HIDE_KEYS.inven), bsky:loadStrList(HIDE_KEYS.bsky), x:loadStrList(HIDE_KEYS.x)};
var blockedAuthors={inven:loadStrList(BLOCK_KEYS.inven), bsky:loadStrList(BLOCK_KEYS.bsky), x:loadStrList(BLOCK_KEYS.x)};
function saveHide(app){
  try{
    localStorage.setItem(HIDE_KEYS[app], JSON.stringify(hiddenIds[app].slice(0,HIDE_CAP)));
    localStorage.setItem(BLOCK_KEYS[app], JSON.stringify(blockedAuthors[app].slice(0,HIDE_CAP)));
  }catch(e){}
}
function isHiddenPost(app, key){ return hiddenIds[app].indexOf(String(key))!==-1; }
function isBlockedAuthor(app, author){ if(!author) return false; return blockedAuthors[app].indexOf(String(author))!==-1; }
function isHiddenOrBlocked(app, key, author){ return isHiddenPost(app, key)||isBlockedAuthor(app, author); }
function hideAuthorOf(app, post){
  if(app==='inven') return post.author||'';
  return post.handle||'';
}
function hidePost(app, key, author){
  key=String(key);
  if(hiddenIds[app].indexOf(key)===-1){
    hiddenIds[app].push(key);
    while(hiddenIds[app].length>HIDE_CAP) hiddenIds[app].shift();
  }
  var addedAuthor=false;
  if(author){
    author=String(author);
    if(blockedAuthors[app].indexOf(author)===-1){
      blockedAuthors[app].push(author);
      addedAuthor=true;
      while(blockedAuthors[app].length>HIDE_CAP) blockedAuthors[app].shift();
    }
  }
  saveHide(app);
  return addedAuthor;
}
function rerenderCurrentView(app){ if(typeof uniLoad==='function') uniLoad(true); }
function undoHide(app, key, author, addedAuthor){
  var i=hiddenIds[app].indexOf(String(key));
  if(i!==-1) hiddenIds[app].splice(i,1);
  if(addedAuthor && author){
    var j=blockedAuthors[app].indexOf(String(author));
    if(j!==-1) blockedAuthors[app].splice(j,1);
  }
  saveHide(app);
  rerenderCurrentView(app);
}
var hideToastEl=null, hideToastTimer=null, hideToastUndo=null;
function showHideToast(app, key, author, addedAuthor){
  if(!hideToastEl){
    hideToastEl=document.createElement('div');
    hideToastEl.className='hide-toast';
    hideToastEl.innerHTML='<span></span><button type="button">되돌리기</button>';
    hideToastEl.querySelector('button').addEventListener('click', function(){
      if(hideToastUndo) hideToastUndo();
      hideToastUndo=null;
      hideToastEl.classList.remove('show');
      if(hideToastTimer){ clearTimeout(hideToastTimer); hideToastTimer=null; }
    });
    document.body.appendChild(hideToastEl);
  }
  hideToastEl.querySelector('span').textContent=author
    ? '글을 숨겼어요. '+author+'님의 글도 안 보여요.'
    : '글을 숨겼어요.';
  hideToastUndo=function(){ undoHide(app, key, author, addedAuthor); };
  hideToastEl.classList.add('show');
  if(hideToastTimer) clearTimeout(hideToastTimer);
  hideToastTimer=setTimeout(function(){ hideToastEl.classList.remove('show'); hideToastTimer=null; hideToastUndo=null; }, 5000);
}
function hideBtnHtml(app, post){
  var key=app==='bsky'?String(post.uri||post.id||''):String(post.id||'');
  return '<button class="hide-btn" type="button" data-hide-app="'+app+'" data-hide-key="'+esc(key)+'" aria-label="관심없음"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg><span>관심없음</span></button>';
}
document.addEventListener('click', function(e){
  var btn=e.target && e.target.closest ? e.target.closest('.hide-btn') : null;
  if(!btn) return;
  e.preventDefault(); e.stopPropagation();
  var app=btn.getAttribute('data-hide-app');
  var key=btn.getAttribute('data-hide-key');
  var post=bkmkPostCache[app+':'+key];
  if(!post || !HIDE_KEYS[app]) return;
  var author=hideAuthorOf(app, post);
  var addedAuthor=hidePost(app, key, author);
  var card=btn.closest('.post-card');
  if(card) card.remove();
  showHideToast(app, key, author, addedAuthor);
});
/* 숨긴 글 관리 — each app's 북마크 view shows this at the top: blocked
   authors with a 해제 button each, hidden-post / blocked-author counts,
   and a "숨긴 글 모두 지우기" that clears both lists for that app
   (both, because a blocked author would keep hiding posts otherwise). */
function hideManageHtml(app){
  var hid=hiddenIds[app].length, blk=blockedAuthors[app].length;
  var html='<div class="hide-manage"><div class="hide-manage-head"><b>숨긴 글 관리</b><span>숨긴 글 '+hid+'개 · 차단한 작성자 '+blk+'명</span></div>';
  if(!hid && !blk){
    html+='<p class="hide-manage-empty">숨긴 글이 없어요. 카드의 관심없음 버튼을 누르면 그 글과 작성자의 글이 안 보여요.</p>';
  } else {
    if(blk){
      html+='<div class="hide-block-list">';
      blockedAuthors[app].forEach(function(a, i){
        html+='<div class="hide-block-row"><span>'+esc(a)+'</span><button class="hide-unblock-btn" type="button" data-unblock-app="'+app+'" data-unblock-idx="'+i+'">해제</button></div>';
      });
      html+='</div>';
    }
    html+='<button class="hide-clear-btn" type="button" data-clear-app="'+app+'">숨긴 글 모두 지우기</button>';
  }
  html+='</div>';
  return html;
}
var tasteOnState={inven:false, bsky:false, x:false};
function tasteOn(app){ return !!tasteOnState[app]; }
var TASTE_STOP=new Set(['그리고','그러나','하지만','또한','혹은','또는','만약','그래서','그러면','그런데','이렇게','저렇게','그렇게','어떻게','무엇','언제','어디','누구','이것','그것','저것','여기','저기','거기','이거','저거','그거','지금','오늘','내일','어제','정말','진짜','너무','아주','많이','하는','된','될','있는','없는','입니다','있습니다','없습니다','the','and','for','with','this','that','from','are','was','were','has','have','not','you','your','what','when','where','who','how','all','new','one','two']);
function tasteTokens(text){
  var out={};
  String(text||'').replace(/[가-힣ㄱ-ㅣa-z0-9]+/gi, function(w){
    w=w.toLowerCase();
    if(w.length>=2 && !TASTE_STOP.has(w)) out[w]=true;
    return w;
  });
  return out;
}
function tasteProfile(app){
  var authors={}, keywords={}, mediaCount={video:0,image:0,gif:0}, n=0;
  function add(author, text, types){
    n++;
    if(author) authors[String(author)]=true;
    var tk=tasteTokens(text);
    Object.keys(tk).forEach(function(k){ keywords[k]=true; });
    if(types){
      if(types.video) mediaCount.video++;
      if(types.image) mediaCount.image++;
      if(types.gif) mediaCount.gif++;
    }
  }
  if(app==='inven'){ bkmkRowsUnfiltered().forEach(function(r){ add(r.p.author, r.p.title, rowMediaTypes(r)); }); }
  else if(app==='bsky'){ bkmks.bsky.forEach(function(p){ add(p.handle, p.text, bskyMediaTypes(p)); }); }

function postMatchesTaste(app, author, text, types, profile){

/* TASTE SCORE — the 취향만 보기 similarity as a NUMBER (0–7) instead of
   a yes/no filter, for RANKING feeds: same author +3, each shared
   keyword (≥2 chars, stopwords excluded) +1 (max 3), same media type
   as the bookmark majority +1. With no bookmarks the profile is null
   and every item scores 0, so the order is unchanged (stable sort).
   tasteProfileAll merges bookmarks across ALL THREE apps (inven
   titles, bsky text, x text) — the unified feed's taste. Per-app
   feeds rank with their own app's profile (same semantics as the
   취향만 보기 toggle). */
function tasteScore(author, text, types, profile){
  if(!profile) return 0;
  var s=0;
  if(author && profile.authors[String(author)]) s+=3;
  var tk=tasteTokens(text), shared=0;
  for(var k in tk){ if(profile.keywords[k]) shared++; }
  s+=Math.min(3, shared);

  return s;
}
function tasteProfileAll(){
  var authors={}, keywords={}, mediaCount={video:0,image:0,gif:0}, n=0;
  function add(author, text, types){
    n++;
    if(author) authors[String(author)]=true;
    var tk=tasteTokens(text);
    Object.keys(tk).forEach(function(k){ keywords[k]=true; });
    if(types){
      if(types.video) mediaCount.video++;
      if(types.image) mediaCount.image++;
      if(types.gif) mediaCount.gif++;
    }
  }
  bkmkRowsUnfiltered().forEach(function(r){ add(r.p.author, r.p.title, rowMediaTypes(r)); });
  bkmks.bsky.forEach(function(p){ add(p.handle, p.text, bskyMediaTypes(p)); });
  bkmks.x.forEach(function(p){ add(p.handle, p.text, xMediaTypes(p)); });
  if(!n) return null;
  var majority=null, best=0;
  ['video','image','gif'].forEach(function(t){ if(mediaCount[t]>best){ best=mediaCount[t]; majority=t; } });
  return {authors:authors, keywords:keywords, mediaType:majority, n:n};
}
/* Stable rank by taste score (highest first). Returns a NEW array; the
   input order is kept for equal scores. */
function rankByTaste(items, profile, getAuthor, getText, getTypes){
  if(!profile) return items.slice();
  var scored=items.map(function(it,i){ return {it:it, i:i, s:tasteScore(getAuthor(it), getText(it), getTypes(it), profile)}; });
  scored.sort(function(a,b){ return b.s-a.s || a.i-b.i; });
  return scored.map(function(x){ return x.it; });
}
/* X TASTE QUERIES — the top keywords of the user's bookmarks across
   all apps (max 3), for the X auto-fetch (unified feed + X app). Each
   bookmarked post contributes its distinct tokens once; the most
   frequent tokens win. URL fragments and pure numbers are skipped so
   Weir credits are never burned on junk queries. */
var X_TASTE_SKIP={http:1, https:1, www:1, com:1, bsky:1, app:1};
function xTasteQueries(){
  var counts={}, order=[];
  function addText(text){
    var tk=tasteTokens(text);
    Object.keys(tk).forEach(function(k){
      if(X_TASTE_SKIP[k] || /^\d+$/.test(k)) return;
      if(!counts[k]){ counts[k]=0; order.push(k); }
      counts[k]++;
    });
  }
  bkmks.inven.forEach(function(p){ addText(p.title||''); });
  bkmks.bsky.forEach(function(p){ addText(p.text||''); });
  bkmks.x.forEach(function(p){ addText(p.text||''); });
  order.sort(function(a,b){ return counts[b]-counts[a]; });
  return order.slice(0,3);
}

   baked snapshot (POSTS) so the gallery is never empty. The proxy also
   returns each live post's body media in post.media (video/photo CDN

var LIVE_URL='https://inven-proxy-nnozu12i-funfunin.cloady.io/api/inven';

   media is routed through the proxy: it fetches the file server-side and
   streams it back with Range support. Only https upload*.inven.co.kr
   URLs are rewritten; anything else passes through unchanged. */
function proxifyMediaSrc(src){
  try{
    var u=new URL(src);
    if(u.protocol==='https:' && /^upload\d*\.inven\.co\.kr$/.test(u.hostname)) return MEDIA_PROXY+encodeURIComponent(src);

/* Shared intake for proxy post lists: keep only well-formed posts and
   rewrite Inven CDN media URLs to the proxy /media endpoint. The proxy
   returns post.media as [{type:'video'|'photo',
   src:'https://upload3.inven.co.kr/...'}] (capped at 5 videos / 4 photos
   per post). Keep only well-formed http(s) URLs — the CDN blocks embedded

   (fetchLive), the search results (galleryDoSearch) and the 전체 tab

function cleanLiveItems(list){

function bskyRkey(uri){ var p=String(uri||'').split('/'); return p[p.length-1]||''; }

function bskyMediaTypes(post){

function bskyRelTime(iso){

  if(s<60) return '방금 전';
  if(s<3600) return Math.floor(s/60)+'분 전';
  if(s<86400) return Math.floor(s/3600)+'시간 전';
  if(s<86400*7) return Math.floor(s/86400)+'일 전';

  return (d.getMonth()+1)+'월 '+d.getDate()+'일';

/* Linkify URLs in post text (after escaping). Trailing punctuation is

    var m=u.match(/^(.*?)([),.;!?]+)$/);

}

function bskyFetch(){
  /* Empty search query: show the "search first" hint, never fetch an
     empty query. (인기 피드 tab is unaffected — it has no query.) */
  if(bskyTab==='search' && !bskyQuery){ bskyLoading=false; bskyErr=false; bskyLoaded=false; bskyPosts=[]; updateBskyStatus(); renderBsky(); return; }
  if(bskyLoading) return;
  bskyLoading=true; bskyErr=false;
  updateBskyStatus();
  var url;
  if(bskyTab==='hot'){
    url=BSKY_API+'/app.bsky.feed.getFeed?feed='+encodeURIComponent(BSKY_HOT_FEED)+'&limit=25';
  } else {
    url=BSKY_API+'/app.bsky.feed.searchPosts?q='+encodeURIComponent(bskyQuery)+'&limit=25&sort=latest';
  }
  var controller=('AbortController' in window)?new AbortController():null;
  var timer=null;
  if(controller){ timer=setTimeout(function(){ try{ controller.abort(); }catch(e){} },15000); }
  var opts={};
  if(controller) opts.signal=controller.signal;
  fetch(url, opts).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  }).then(function(data){
    var raw=[];
    if(bskyTab==='hot' && data && Array.isArray(data.feed)){
      data.feed.forEach(function(it){ if(it && it.post) raw.push(it.post); });
    } else if(data && Array.isArray(data.posts)){
      raw=data.posts;
    }
    var norm=[];
    raw.forEach(function(p){ var n=bskyNormalize(p); if(n) norm.push(n); });
    /* 인기 피드는 매번 순서를 섞어요 (틱톡처럼 켤 때마다 다르게). 검색은
       찾는 용도라 최신순 그대로, 절대 섞지 않아요. */
    if(bskyTab==='hot') shuffleInPlace(norm);
    if(bskyTab==='hot') bskyCursor=(data && data.cursor)||null;
    if(timer) clearTimeout(timer);
    bskyPosts=norm; bskyLoading=false; bskyLoaded=true;
    renderBsky();
  }).catch(function(){
    if(timer) clearTimeout(timer);
    bskyLoading=false; bskyErr=true;
    renderBsky();
  });
}
function bskyFilteredPosts(){
  var out=bskyPosts;
  if(bskyMediaFilter!=='all') out=out.filter(function(p){
    var t=bskyMediaTypes(p);
    if(bskyMediaFilter==='video') return !!t.video;
    if(bskyMediaFilter==='gif') return !!t.gif;
    if(bskyMediaFilter==='image') return !!t.image;
    return true;
  });
  out=out.filter(function(p){ return !isHiddenOrBlocked('bsky', p.uri||p.id, p.handle); });
  out=applyTasteFilter('bsky', out, function(p){ return p.handle; }, function(p){ return p.text; }, function(p){ return bskyMediaTypes(p); });
  /* 인기 피드는 북마크 취향 순으로 정렬해요 (비슷한 게 위로) — 검색 탭은
     찾는 용도라 최신순 그대로, 절대 섞거나 정렬하지 않아요. */
  if(bskyTab==='hot') out=rankByTaste(out, tasteProfile('bsky'), function(p){ return p.handle; }, function(p){ return p.text; }, function(p){ return bskyMediaTypes(p); });
  return out;
}
/* BLUESKY "MORE" — bookmarking on the 인기 피드 pulls the next page

   so the card just bookmarked stays in view. */

function bskyFetchMore(){
  if(bskyTab!=='hot' || bskyLoadingMore || bskyLoading) return;

/* A video that errors: if it was the mp4 (getBlob) path and an HLS
