  if(controller){ timer=setTimeout(function(){ try{ controller.abort(); }catch(e){} },15000); }
  var opts={}; if(controller) opts.signal=controller.signal;
  var url=BSKY_API+'/app.bsky.feed.getFeed?feed='+encodeURIComponent(BSKY_HOT_FEED)+'&limit=25'+(cursor?('&cursor='+encodeURIComponent(cursor)):'');
  fetch(url, opts).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.json();
  }).then(function(data){
    if(timer) clearTimeout(timer);
    var out=[];
    var raw=(data && Array.isArray(data.feed))?data.feed:[];
    raw.forEach(function(it){
      var n=it&&it.post?bskyNormalize(it.post):null;
      if(!n) return;
      if(isHiddenOrBlocked('bsky', n.uri||n.id, n.handle)) return;
      out.push(n);
    });
    cb({posts:out, cursor:(data && data.cursor)||''});
  }).catch(function(){
    if(timer) clearTimeout(timer);
    cb({error:true});
  });
}
function fetchBskyHotVideos(cb, cursor){
  fetchBskyHotPage(function(res){
    if(res.error){ cb(res); return; }
    var out=res.posts.filter(function(n){
      return (n.media||[]).some(function(m){ return m.type==='video'; });
    });
    cb({posts:out, cursor:res.cursor});
  }, cursor);
}
/* UNIFIED FEED (통합 피드) — TikTok-style: gallery + Bluesky + X + Nimi
   playback in one vertical snap feed. Sources load in parallel on
   open and are interleaved round-robin (gallery, Bluesky, X, ...),
   then ranked by taste score (similar to bookmarks first; stable
   sort keeps the interleave for equal scores). Gallery contributes
   media posts only; Bluesky contributes media posts (video/image/
   GIF); X contributes the bookmark-keyword searches (max 3). Nimi
   joins as PLAYBACK, not a source: Bluesky videos play directly
   in-feed via the PDS-host getBlob mp4 (the watch app's resolver),
   HLS fallback — no new tab. Bookmarks write into the same
   per-source stores as the home apps. Near the end (3rd-from-last
   slide visible) a fresh batch is fetched and only unseen posts are
   appended; 새로고침 does the same on demand. */
var uniLoaded=false, uniLoading=false, uniLoadingMore=false, uniNoMore=false;
var uniItems=[];
var uniSeenKeys={};
var uniBskyCursor=null;
var uniSoundOn=false;
var uniVideos=[];
var uniVidObserver=null;
var uniNearEndObserver=null;
var UNI_MAX=120;
var UNI_HEART_SVG='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>';
function uniSizeFeed(){
  var feed=document.getElementById('uniFeed');
  if(!feed || currentView!=='uni') return;
  var top=feed.getBoundingClientRect().top;
  var h=Math.max(320, Math.floor(window.innerHeight-top-96));
  feed.style.height=h+'px';
}
function uniSetStatus(txt, live){
  var el=document.getElementById('uniStatus');
  if(el){
    el.className='live-status '+(live?'is-live':'');
    el.innerHTML='<i></i><span>'+esc(txt)+'</span>';
  }
  var btn=document.getElementById('uniRefreshBtn');
  if(btn){
    btn.disabled=uniLoading;
    btn.classList.toggle('spinning', uniLoading);
    var bl=document.getElementById('uniRefreshLabel'); if(bl) bl.textContent=uniLoading?'불러오는 중':'새로고침';
  }
}
function uniSetInfo(txt){ var el=document.getElementById('uniInfo'); if(el) el.textContent=txt||''; }
/* Per-source intake: each item is {src, key, author, text, types,
   build} — build() returns the home app's own card element, so
   bookmarks/hide/원문 보기 behave exactly like the home apps. */
function uniItemsFromRows(rows){
  var out=[];
  (rows||[]).forEach(function(r){
    var t=rowMediaTypes(r);
    if(!t.video && !t.image && !t.gif) return;
    out.push({src:'inven', key:'inven:'+r.p.id, author:r.p.author, text:r.p.title, types:t, build:function(){ return buildPostCard(r); }});
  });
  return out;
}
function uniItemsFromBsky(posts){
  var out=[];
  (posts||[]).forEach(function(p){
    if(!(p.media||[]).length) return;
    out.push({src:'bsky', key:'bsky:'+p.uri, author:p.handle, text:p.text, types:bskyMediaTypes(p), build:function(){ return bskyBuildCard(p); }});
  });
  return out;
}
function uniItemsFromX(posts){
  var out=[];
  (posts||[]).forEach(function(p){
    if(!(p.media||[]).length) return;
    out.push({src:'x', key:'x:'+p.id, author:p.handle, text:p.text, types:xMediaTypes(p), build:function(){ return xBuildCard(p); }});
  });
  return out;
}
function uniInterleave(lists){
  var out=[], i=0, more=true;
  while(more){
    more=false;
    lists.forEach(function(l){ if(i<l.length){ out.push(l[i]); more=true; } });
    i++;
  }
  return out;
}
function uniRank(items){
  return rankByTaste(items, tasteProfileAll(), function(it){ return it.author; }, function(it){ return it.text; }, function(it){ return it.types; });
}
function uniAppendItems(newItems){
  var added=[];
  newItems.forEach(function(it){
    if(uniSeenKeys[it.key]) return;
    var rawKey=it.key.replace(/^(inven|bsky|x):/, '');
    if(isHiddenOrBlocked(it.src, rawKey, it.author)) return;
    uniSeenKeys[it.key]=true;
    added.push(it);
  });
  return added;
}
function uniFetchGallery(cb){
  var controller=('AbortController' in window)?new AbortController():null;
  var timer=null;
  if(controller){ timer=setTimeout(function(){ try{ controller.abort(); }catch(e){} },15000); }
  var opts={cache:'no-store'};
  if(controller) opts.signal=controller.signal;
  fetch(LIVE_URL, opts).then(function(res){
    if(!res.ok) throw new Error('HTTP '+res.status);
    return res.text();
  }).then(function(text){
    var data=null;
    try{ data=JSON.parse(text); }catch(e){ throw new Error('not-json'); }
    if(!data || !Array.isArray(data.matched)) throw new Error('bad-data');
    if(timer) clearTimeout(timer);
    cb({rows:rowsFromLive(cleanLiveItems(data.matched))});
  }).catch(function(){
    if(timer) clearTimeout(timer);
    /* Live failed: the baked snapshot is the gallery's own fallback,
       so the feed still has gallery posts. */
    cb({rows:matchedPosts()});
  });
}
function uniFetchBsky(cb){
  fetchBskyHotPage(function(res){
    if(res.error){ cb({posts:[]}); return; }
    uniBskyCursor=res.cursor||uniBskyCursor;
    cb({posts:res.posts});
  }, uniBskyCursor);
}
function uniFetchX(cb){
  var qs=xTasteQueries();
  if(!qs.length){ cb({posts:[], noQueries:true}); return; }
  xFetchQueries(qs, function(res){
    if(res.error){ cb({posts:[]}); return; }
    cb({posts:res.posts});
  });
}
function uniSlideFor(item){
  var card=item.build();
  var slide=document.createElement('div');
  slide.className='uni-slide';
  slide.setAttribute('data-uni-key', item.key);
  slide.setAttribute('data-uni-src', item.src);
  slide.appendChild(card);
  /* Rename the videos so the per-app setups (which query .bsky-video
     etc. document-wide) never touch unified slides: one dedicated
     observer owns them. Data attributes are kept, so the same play /
     mp4-upgrade / error paths apply. */
  Array.prototype.slice.call(card.querySelectorAll('.bsky-video, .x-video, .feed-video')).forEach(function(v){
    var kind=v.classList.contains('bsky-video')?'bsky':v.classList.contains('x-video')?'x':'inven';
    v.classList.remove('bsky-video','x-video','feed-video');
    v.classList.add('uni-video');
    v.setAttribute('data-uni-kind', kind);
  });
  return slide;
}
function uniTryPlay(v){
  var kind=v.getAttribute('data-uni-kind');
  if(kind==='bsky') bskyTryPlay(v);
  else if(kind==='x') xTryPlay(v);
  else tryPlay(v);
}
function uniVideoError(v){
  var kind=v.getAttribute('data-uni-kind');
  if(kind==='bsky') bskyVideoError(v);
  else if(kind==='x') xVideoFallback(v);
}
function applyUniSound(){
  uniVideos.forEach(function(v){
    v.muted = !(uniSoundOn && v.getAttribute('data-inview')==='1' && v.getAttribute('data-audio')==='1');
  });
  var btn=document.getElementById('uniSoundToggle');
  if(btn){ btn.classList.toggle('on', uniSoundOn); btn.setAttribute('aria-pressed', uniSoundOn?'true':'false'); }
  var label=document.getElementById('uniSoundLabel'); if(label) label.textContent=uniSoundOn?'소리 끄기':'소리 켜기';
  var note=document.getElementById('uniSoundNote');
  if(note) note.textContent=uniSoundOn?'소리가 켜졌어요. 화면에 보이는 영상의 소리가 납니다.':'영상을 밀어 올리면 다음 글이 자동재생돼요. 소리는 이 버튼을 한 번 누르면 켜집니다.';
}
function setupUniVideos(){
  uniVideos=Array.prototype.slice.call(document.querySelectorAll('#uniFeed .uni-video'));
  if(uniVidObserver){ uniVidObserver.disconnect(); uniVidObserver=null; }
  uniVideos.forEach(function(v){
    if(!v._uniWired){
      v._uniWired=true;
      v.addEventListener('error', function(){ uniVideoError(v); });
      if(v.getAttribute('data-uni-kind')==='bsky') bskyUpgradeMp4(v);
    }
  });
  var feed=document.getElementById('uniFeed');
  if(!feed) return;
  if(!('IntersectionObserver' in window)){
    uniVideos.forEach(function(v){ v.setAttribute('data-inview','1'); uniTryPlay(v); });
    applyUniSound();
    return;
  }
  uniVidObserver=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      var v=en.target;
      if(en.intersectionRatio>=0.35){ v.setAttribute('data-inview','1'); uniTryPlay(v); }
      else { v.setAttribute('data-inview','0'); v.pause(); }
    });
    applyUniSound();
  },{root:feed, threshold:[0,0.35,0.75]});
  uniVideos.forEach(function(v){ uniVidObserver.observe(v); });
  applyUniSound();
}
/* Near-end: when one of the last 3 slides is half visible, pull a
   fresh batch. (A sentinel div cannot work here: mandatory snap
   never lets the scroll rest on a non-snap child.) */
function uniObserveNearEnd(){
  if(uniNearEndObserver){ uniNearEndObserver.disconnect(); uniNearEndObserver=null; }
  var feed=document.getElementById('uniFeed');
  if(!feed || !('IntersectionObserver' in window)) return;
  var slides=feed.querySelectorAll('.uni-slide');
  if(slides.length<3) return;
  uniNearEndObserver=new IntersectionObserver(function(entries){
    entries.forEach(function(en){
      /* Scrolling away from the end re-arms the fetch: a 0-add round
         sets uniNoMore, but new posts may arrive later, so leaving
         the zone clears it. While the user stays at the end the flag
         stays set, so the observer cannot refetch in a loop. */
      if(en.intersectionRatio<0.5){ uniNoMore=false; return; }
      var idx=Array.prototype.indexOf.call(feed.querySelectorAll('.uni-slide'), en.target);
      if(idx>=uniItems.length-3) uniFetchMore();
    });
  },{root:feed, threshold:[0,0.5]});
  for(var i=Math.max(0,slides.length-3); i<slides.length; i++) uniNearEndObserver.observe(slides[i]);
}
function uniRender(){
  var feed=document.getElementById('uniFeed');
  if(!feed) return;
  feed.innerHTML='';
  uniItems.forEach(function(it){ feed.appendChild(uniSlideFor(it)); });
  var fc=document.getElementById('uniCounter');
  if(fc) fc.textContent='총 '+uniItems.length+'개';
  setupUniVideos();
  uniObserveNearEnd();
}
function uniRenderAppend(added){
  var feed=document.getElementById('uniFeed');
  if(!feed) return;
  added.forEach(function(it){ feed.appendChild(uniSlideFor(it)); });
  var fc=document.getElementById('uniCounter');
  if(fc) fc.textContent='총 '+uniItems.length+'개';
  setupUniVideos();
  uniObserveNearEnd();
}
function uniCurrentKey(){
  var feed=document.getElementById('uniFeed');
  if(!feed) return null;
  var fr=feed.getBoundingClientRect();
  var best=null, bestArea=0;
  Array.prototype.slice.call(feed.querySelectorAll('.uni-slide')).forEach(function(s){
    var r=s.getBoundingClientRect();
    var vis=Math.max(0, Math.min(r.bottom, fr.bottom)-Math.max(r.top, fr.top));
    if(vis>bestArea){ bestArea=vis; best=s; }
  });
  return best?best.getAttribute('data-uni-key'):null;
}
function uniRerank(){
  if(!uniLoaded || !uniItems.length) return;
  uniItems=uniRank(uniItems);
  var feed=document.getElementById('uniFeed');
  if(!feed) return;
  var cur=uniCurrentKey();
  var order={};
  uniItems.forEach(function(it,i){ order[it.key]=i; });
  var slides=Array.prototype.slice.call(feed.querySelectorAll('.uni-slide'));
  slides.sort(function(a,b){ return (order[a.getAttribute('data-uni-key')]||0)-(order[b.getAttribute('data-uni-key')]||0); });
  slides.forEach(function(s){ feed.appendChild(s); });
  if(cur){
    var el=feed.querySelector('.uni-slide[data-uni-key="'+cur+'"]');
    if(el) el.scrollIntoView({block:'start'});
  }
}
/* uniFetchMore(fromBookmark) — fresh batches from all 3 sources,
   unseen only, re-ranked. A 0-add round from a SCROLL sets uniNoMore
   (prevents the near-end observer refetching in a loop while the user
   stays at the end); a 0-add round from a BOOKMARK does not — the
   bookmark fetch is best-effort, and blocking later scroll fetches
   because of it would strand the feed. */
function uniFetchMore(fromBookmark){
  if(!uniLoaded || uniLoading || uniLoadingMore || uniNoMore) return;
  if(uniItems.length>=UNI_MAX){ uniNoMore=true; return; }
  uniLoadingMore=true;
  var done=0, gRows=null, bPosts=null, xPosts=null;
  function maybe(){
    done++;
    if(done<3) return;
    uniLoadingMore=false;
    var fresh=uniRank(uniInterleave([
      uniItemsFromRows(gRows||[]),
      uniItemsFromBsky(bPosts||[]),
      uniItemsFromX(xPosts||[])
    ]));
    var added=uniAppendItems(fresh);
    if(added.length){
      uniItems=uniRank(uniItems.concat(added));
      uniRenderAppend(added);
      /* Merge the fresh batch into the RANKED DOM order (not just
         appended at the end): after a bookmark, similar posts from
         the fresh batch used to land at the bottom, out of sight, so
         the re-rank looked like it did nothing. uniRerank re-sorts
         the DOM to match uniItems and scrolls the post being viewed
         back into place, so the user stays on the same card. */
      uniRerank();
      uniSetInfo('새 글 '+added.length+'개가 이어졌어요.');
    } else {
      if(!fromBookmark) uniNoMore=true;
      uniSetInfo('새 글이 없어요. 새로고침을 눌러 보세요.');
    }
  }
  uniFetchGallery(function(r){ gRows=r.rows; maybe(); });
  uniFetchBsky(function(r){ bPosts=r.posts; maybe(); });
  uniFetchX(function(r){ xPosts=r.posts; maybe(); });
}
function uniLoad(force){
  if(uniLoading) return;
  if(uniLoaded && !force){ uniSizeFeed(); return; }
  var feed=document.getElementById('uniFeed');
  if(!feed) return;
  uniSizeFeed();
  uniLoading=true; uniLoaded=false; uniNoMore=false;
  uniItems=[]; uniSeenKeys={}; uniBskyCursor=null;
  feed.innerHTML='<div class="list-empty"><b>통합 피드를 가져오는 중…</b></div>';
  uniSetStatus('오픈 갤러리·블루스카이·X에서 가져오는 중입니다…');
  uniSetInfo('');
  var done=0, gRows=null, bPosts=null, xPosts=null, xNoQ=false;
  function maybe(){
    done++;
    if(done<3) return;
    uniLoading=false;
    var merged=uniRank(uniInterleave([
      uniItemsFromRows(gRows||[]),
      uniItemsFromBsky(bPosts||[]),
      uniItemsFromX(xPosts||[])
    ]));
    var added=uniAppendItems(merged);
    uniItems=added;
    if(!uniItems.length){
      feed.innerHTML='<div class="list-empty"><b>피드를 가져오지 못했어요</b><span style="color:var(--muted);font-size:14px;line-height:1.6">연결을 확인하고 다시 시도해 주세요.</span><button class="refresh-btn" id="uniRetryBtn" type="button">다시 시도</button></div>';
      var rb=document.getElementById('uniRetryBtn');
      if(rb) rb.addEventListener('click', function(){ uniLoad(true); });
      uniSetStatus('불러오지 못했어요 — 다시 시도해 주세요');
      uniSetInfo('');
      return;
    }
    uniLoaded=true;
    uniRender();
    uniSetStatus('통합 피드 · '+uniItems.length+'개', true);
    uniSetInfo(xNoQ
      ? '북마크하면 X에서도 비슷한 게 떠요'
      : '오픈 갤러리·블루스카이·X가 섞여 있어요. 끝까지 밀면 새 글이 이어져요.');
  }
  uniFetchGallery(function(r){ gRows=r.rows; maybe(); });
  uniFetchBsky(function(r){ bPosts=r.posts; maybe(); });
  uniFetchX(function(r){ xPosts=r.posts; xNoQ=!!r.noQueries; maybe(); });
}
var uniSoundBtnEl=document.getElementById('uniSoundToggle');
if(uniSoundBtnEl) uniSoundBtnEl.addEventListener('click', function(){
  uniSoundOn=!uniSoundOn;
  if(uniSoundOn) uniVideos.forEach(function(v){ if(v.getAttribute('data-inview')==='1') uniTryPlay(v); });
  applyUniSound();
});
var uniRefreshBtnEl=document.getElementById('uniRefreshBtn');
if(uniRefreshBtnEl) uniRefreshBtnEl.addEventListener('click', function(){
  if(!uniLoaded && !uniLoading){ uniLoad(true); return; }
  uniNoMore=false;
  uniFetchMore();
});
/* TAP = sound toggle, DOUBLE-TAP = bookmark (+ heart pop). One click
   waits 260ms to see if a second tap follows; buttons/links inside
   the card (북마크, 원문 보기, 관심없음) are left alone. */
var uniFeedEl=document.getElementById('uniFeed');
if(uniFeedEl) uniFeedEl.addEventListener('click', function(e){
  if(e.target.closest('button, a, input')) return;
  var slide=e.target.closest('.uni-slide');
  if(!slide) return;
  if(slide._tapTimer){ clearTimeout(slide._tapTimer); slide._tapTimer=null; uniDoubleTap(slide); return; }
  slide._tapTimer=setTimeout(function(){
    slide._tapTimer=null;
    uniSoundOn=!uniSoundOn;
    var v=slide.querySelector('.uni-video');
    if(uniSoundOn && v && v.getAttribute('data-inview')==='1') uniTryPlay(v);
    applyUniSound();
  }, 260);
});
function uniDoubleTap(slide){
  var heart=slide.querySelector('.uni-heart');
  if(!heart){
    heart=document.createElement('span');
    heart.className='uni-heart';
    heart.innerHTML=UNI_HEART_SVG;
    slide.appendChild(heart);
  }
  heart.classList.remove('pop'); void heart.offsetWidth; heart.classList.add('pop');
  var btn=slide.querySelector('.bkmk-btn');
  if(btn) btn.click();
}
window.addEventListener('resize', function(){ if(currentView==='uni') uniSizeFeed(); });
window.addEventListener('orientationchange', function(){ if(currentView==='uni') setTimeout(uniSizeFeed, 300); });
function pad2(n){ return (n<10?'0':'')+n; }

/* STANDALONE INIT — this page IS the unified feed: no hub show() exists,
   so the feed loads on page load. currentView stays 'uni' so uniSizeFeed
   and the resize listeners work as in the hub. */
var currentView='uni';
try{ uniLoad(); }catch(e){ console.error('uniLoad failed', e); }

  </script>
